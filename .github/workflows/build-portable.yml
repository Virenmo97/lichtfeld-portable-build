name: Build LichtFeld Studio (portable)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8"
      BUILD_DIR: build

    steps:
      - name: Clone LichtFeld-Studio source
        shell: pwsh
        run: git clone --recurse-submodules https://github.com/MrNeRF/LichtFeld-Studio.git lfs

      - name: Install CUDA 12.8
        shell: pwsh
        run: |
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe -OutFile cuda.exe -Verbose
          Start-Process -FilePath .\cuda.exe -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        shell: pwsh
        run: |
          echo "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg_installed
        uses: actions/cache@v4
        with:
          path: lfs/${{ env.BUILD_DIR }}/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-portable-${{ hashFiles('lfs/vcpkg.json', 'lfs/vcpkg-configuration.json', 'lfs/.github/overlays/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-portable-

      - name: Configure (portable build)
        shell: cmd
        working-directory: lfs
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B %BUILD_DIR% -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PORTABLE=ON -DBUILD_PYTHON_STUBS=OFF

      - name: Build
        shell: cmd
        working-directory: lfs
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build %BUILD_DIR% -j %NUMBER_OF_PROCESSORS%

      - name: Install (create portable dist)
        shell: cmd
        working-directory: lfs
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --install %BUILD_DIR% --prefix ./dist

      - name: List dist contents
        shell: pwsh
        working-directory: lfs
        run: Get-ChildItem .\dist -Recurse | Select-Object FullName

      - name: Smoke test --help (best-effort, no GPU on this runner)
        shell: pwsh
        working-directory: lfs
        continue-on-error: true
        run: '& ".\dist\bin\LichtFeld-Studio.exe" --help'

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: LichtFeld-Studio-portable-windows
          path: lfs/dist
          retention-days: 14
